name: MSNgram Release APKs

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - migrate/msngram-full-13.1.1

permissions:
  contents: read

concurrency:
  group: msngram-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Build installable split APKs for both supported ARM ABIs.
        abi: [arm64-v8a, armeabi-v7a]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NATIVE_TARGET: ${{ matrix.abi }}
      BUILD_TIMESTAMP: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure release build
        env:
          KEYSTORE_B64: ${{ secrets.WEBPROXY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/webproxy-release.p12"
          chmod 600 "$RUNNER_TEMP/webproxy-release.p12"
          python3 - <<'PY'
          from pathlib import Path
          import os
          Path('local.properties').write_text('sdk.dir=' + os.environ['ANDROID_HOME'] + '\n')
          p = Path('gradle.properties')
          lines = [s for s in p.read_text().splitlines() if not s.startswith('org.gradle.jvmargs=')]
          p.write_text('\n'.join(lines) + '\norg.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -Dfile.encoding=UTF-8\n')
          for module in Path('TMessagesProj_Modules/media/libraries').glob('*/build.gradle'):
              text = module.read_text()
              text = text.replace("apply plugin: 'kotlin-android'", "// Kotlin is provided by the Android Gradle plugin.")
              text = __import__('re').sub(r'\n    kotlinOptions \{\n        jvmTarget = \'1\.8\'\n    \}\n', '\n', text)
              module.write_text(text)
          PY
      - name: Build signed release APK
        env:
          WEBPROXY_KEYSTORE_FILE: ${{ runner.temp }}/webproxy-release.p12
          KEYSTORE_PASS: ${{ secrets.WEBPROXY_KEYSTORE_PASSWORD }}
          ALIAS_PASS: ${{ secrets.WEBPROXY_KEYSTORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.WEBPROXY_KEY_ALIAS }}
          LOCAL_PROPERTIES: ''
        run: |
          python3 scripts/test-localization-generator.py
          python3 scripts/test-webproxy-callbacks.py
          python3 scripts/test-localization-runtime.py
          ./gradlew TMessagesProj:compileReleaseKotlin TMessagesProj:compileReleaseJavaWithJavac TMessagesProj:checkReleaseDuplicateClasses TMessagesProj:processReleaseMainManifest --stacktrace
          python3 scripts/test-localization-runtime.py TMessagesProj/build/generated/generateLocalizationUtilsJava/release/org/telegram/localization/LocalizationUtils.java
          ./gradlew TMessagesProj:assembleRelease --stacktrace
      - name: Preserve raw signed APK for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MSNgram-raw-${{ matrix.abi }}
          path: TMessagesProj/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Verify and stage release APK
        env:
          EXPECTED_SIGNER: 2a6ad2b3b9326cc6b0cd85063da46230ddc5587511cb978e862918384913efaa
        run: |
          mkdir -p out
          APK=$(find TMessagesProj/build/outputs/apk/release -name '*.apk')
          export APK_PATH="$APK"
          test "$(printf '%s\n' "$APK" | wc -l)" -eq 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee out/signature-${NATIVE_TARGET}.txt
          grep -q "$EXPECTED_SIGNER" out/signature-${NATIVE_TARGET}.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > out/manifest-${NATIVE_TARGET}.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > out/manifest-tree-${NATIVE_TARGET}.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources "$APK" > out/resources-${NATIVE_TARGET}.txt
          python3 - <<'PY'
          import os,pathlib,re
          abi=os.environ['NATIVE_TARGET']; p=pathlib.Path('out')
          badging=(p/('manifest-'+abi+'.txt')).read_text()
          manifest=(p/('manifest-tree-'+abi+'.txt')).read_text()
          resources=(p/('resources-'+abi+'.txt')).read_text()
          assert "package: name='com.msngram.messenger'" in badging, 'compiled package identity missing from aapt2 badging'
          label=re.search(r'android:label\([^)]*\)=@(0x[0-9a-f]+)', manifest)
          assert label, 'compiled manifest has no resource-backed application label'
          label_id=label.group(1).lower()
          assert "application-label:'MSNgram'" in badging, 'resolved application label is not MSNgram'
          assert label_id in resources.lower(), (label_id, 'application-label resource ID missing from resources.arsc dump')
          assert 'MSNgram' in resources, 'MSNgram value missing from resources.arsc dump'
          for name in ('mipmap/ic_launcher_msngram_blue','mipmap/ic_launcher_msngram'):
              assert name in resources, 'compiled icon resource missing: '+name
          print('Package, application-label resource ID and MSNgram icon resource entries verified from APK AndroidManifest.xml/resources.arsc')
          PY
          python3 scripts/check-apk-assets.py "$APK"
          python3 - "$APK" <<'PY'
          import sys,os,zipfile,pathlib,json,hashlib,re
          apk=pathlib.Path(sys.argv[1]); abi=os.environ['NATIVE_TARGET']
          z=zipfile.ZipFile(apk)
          libs=[n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
          assert libs and {n.split('/')[1] for n in libs}=={abi},libs
          assert any('libtmessages' in n for n in libs),libs
          dex=b''.join(z.read(n) for n in z.namelist() if n.endswith('.dex'))
          for cls in (b'Lorg/telegram/utils/proxy/WebProxyTransport;',b'Lorg/telegram/utils/proxy/WebProxyConnectionTester;'):
              assert cls in dex,cls
          badging=pathlib.Path('out/manifest-'+abi+'.txt').read_text()
          assert "name='com.msngram.messenger'" in badging
          properties = dict(line.split('=', 1) for line in pathlib.Path('gradle.properties').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
          version = properties['APP_VERSION_NAME']
          version_code = int(properties['APP_VERSION_CODE'])
          assert f"versionName='{version}'" in badging and f"versionCode='{version_code}'" in badging
          sdk_match=re.search(r"minSdkVersion:\s*'?([0-9]+)'?", badging)
          assert sdk_match and sdk_match.group(1) == '27', ('unexpected minSdk in aapt2 badging', badging)
          assert 'application-debuggable' not in badging
          name=f'MSNgram-v{version}-{abi}.apk'
          target=pathlib.Path('out')/name
          target.write_bytes(apk.read_bytes())
          evidence={'sha':os.environ['GITHUB_SHA'],'abi':abi,'sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'size':target.stat().st_size,'libs':libs,'webproxy_classes':True,'package':'com.msngram.messenger','versionName':version,'versionCode':version_code,'minSdk':27}
          pathlib.Path('out/verification-'+abi+'.json').write_text(json.dumps(evidence,indent=2))
          print(json.dumps(evidence))
          PY
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/webproxy-release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: MSNgram-release-${{ matrix.abi }}
          path: out/*
          if-no-files-found: error
