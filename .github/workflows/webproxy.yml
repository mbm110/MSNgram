name: Web Proxy Release APKs

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: webproxy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NATIVE_TARGET: ${{ matrix.abi }}
      BUILD_TIMESTAMP: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure release build
        env:
          KEYSTORE_B64: ${{ secrets.WEBPROXY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/webproxy-release.p12"
          chmod 600 "$RUNNER_TEMP/webproxy-release.p12"
          python3 - <<'PY'
          from pathlib import Path
          import os
          Path('local.properties').write_text('sdk.dir=' + os.environ['ANDROID_HOME'] + '\n')
          p = Path('gradle.properties')
          lines = [s for s in p.read_text().splitlines() if not s.startswith('org.gradle.jvmargs=')]
          p.write_text('\n'.join(lines) + '\norg.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -Dfile.encoding=UTF-8\n')
          PY
      - name: Build signed release APK
        env:
          WEBPROXY_KEYSTORE_FILE: ${{ runner.temp }}/webproxy-release.p12
          KEYSTORE_PASS: ${{ secrets.WEBPROXY_KEYSTORE_PASSWORD }}
          ALIAS_PASS: ${{ secrets.WEBPROXY_KEYSTORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.WEBPROXY_KEY_ALIAS }}
          LOCAL_PROPERTIES: ''
        run: ./gradlew TMessagesProj:assembleRelease --stacktrace
      - name: Verify and stage release APK
        env:
          EXPECTED_SIGNER: 2a6ad2b3b9326cc6b0cd85063da46230ddc5587511cb978e862918384913efaa
        run: |
          mkdir -p out
          APK=$(find TMessagesProj/build/outputs/apk/release -name '*.apk')
          test "$(printf '%s\n' "$APK" | wc -l)" -eq 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee out/signature-${NATIVE_TARGET}.txt
          grep -q "$EXPECTED_SIGNER" out/signature-${NATIVE_TARGET}.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > out/manifest-${NATIVE_TARGET}.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > out/manifest-tree-${NATIVE_TARGET}.txt
          for resource in auth sync_contacts contacts auth_menu; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" res/xml/${resource}.xml > out/${resource}-${NATIVE_TARGET}.txt
          done
          python3 - <<'PY'
          import os,pathlib,re
          abi=os.environ['NATIVE_TARGET']; p=pathlib.Path('out')
          manifest=(p/('manifest-tree-'+abi+'.txt')).read_text()
          authorities=re.findall(r'android:authorities[^=]*="([^"]+)"',manifest)
          assert authorities and all(a.startswith('nu.gpu.nagram.webproxy.') for a in authorities),authorities
          permissions=re.findall(r'android:name[^=]*="([^"]+)"',manifest)
          assert 'nu.gpu.nagram.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' not in permissions
          for resource in ('auth','sync_contacts','contacts','auth_menu'):
              text=(p/(resource+'-'+abi+'.txt')).read_text()
              assert 'nu.gpu.nagram.webproxy' in text
              assert '"nu.gpu.nagram"' not in text
          assert "application-label:'NagramX WebProxy'" in (p/('manifest-'+abi+'.txt')).read_text()
          print('Package, provider authorities, account types and display name verified')
          PY
          python3 - "$APK" <<'PY'
          import sys,os,zipfile,pathlib,json,hashlib
          apk=pathlib.Path(sys.argv[1]); abi=os.environ['NATIVE_TARGET']
          z=zipfile.ZipFile(apk)
          libs=[n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
          assert libs and {n.split('/')[1] for n in libs}=={abi},libs
          assert any('libtmessages' in n for n in libs),libs
          dex=b''.join(z.read(n) for n in z.namelist() if n.endswith('.dex'))
          for cls in (b'Lorg/telegram/utils/proxy/WebProxyTransport;',b'Lorg/telegram/utils/proxy/WebProxyConnectionTester;'):
              assert cls in dex,cls
          badging=pathlib.Path('out/manifest-'+abi+'.txt').read_text()
          assert "name='nu.gpu.nagram.webproxy'" in badging
          assert "versionName='12.10.0'" in badging and "versionCode='1262'" in badging
          assert "sdkVersion:'27'" in badging
          assert 'application-debuggable' not in badging
          name='NagramX-WebProxy-v12.10.0(1262)-'+abi+'.apk'
          target=pathlib.Path('out')/name
          target.write_bytes(apk.read_bytes())
          evidence={'sha':os.environ['GITHUB_SHA'],'abi':abi,'sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'size':target.stat().st_size,'libs':libs,'webproxy_classes':True,'package':'nu.gpu.nagram.webproxy','versionName':'12.10.0','versionCode':1262,'minSdk':27}
          pathlib.Path('out/verification-'+abi+'.json').write_text(json.dumps(evidence,indent=2))
          print(json.dumps(evidence))
          PY
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/webproxy-release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: NagramX-WebProxy-release-${{ matrix.abi }}
          path: out/*
          if-no-files-found: error
